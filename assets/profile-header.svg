<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyanOrb" cx="15%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="purpleOrb" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .name-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#textGrad); letter-spacing: -0.03em; }
    .role-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 19px; fill: #94A3B8; letter-spacing: -0.01em; }
    .badge-chip { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: 12.5px; fill: #38BDF8; }
    .metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 24px; fill: #38BDF8; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #64748B; text-transform: uppercase; letter-spacing: 0.05em; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Ambient Glows -->
  <rect width="1200" height="320" rx="16" fill="url(#cyanOrb)" />
  <rect width="1200" height="320" rx="16" fill="url(#purpleOrb)" />

  <!-- Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
  </g>

  <!-- Role Status Pill -->
  <g transform="translate(60, 42)">
    <rect width="265" height="30" rx="15" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#10B981" />
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12px" fill="#38BDF8">AVAILABLE FOR FREELANCE &amp; HIRE</text>
  </g>

  <!-- Hero Header -->
  <text x="60" y="118" class="name-title">Prakhar Singh</text>
  <text x="60" y="152" class="role-subtitle">AI Engineer &amp; Agent Architect • LangGraph • RAG • Production Automation</text>

  <!-- Feature Chips -->
  <g transform="translate(60, 188)">
    <g transform="translate(0, 0)">
      <rect width="195" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="badge-chip">🤖 Multi-Agent Systems</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="badge-chip">⚖️ Verifiable RAG</text>
    </g>
    <g transform="translate(405, 0)">
      <rect width="205" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="badge-chip">⚡ High-Speed Pipelines</text>
    </g>
    <g transform="translate(625, 0)">
      <rect width="195" height="34" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="badge-chip">🛡️ Adversarial Red Team</text>
    </g>
  </g>

  <!-- Quick Bio Tagline -->
  <g transform="translate(60, 255)">
    <text x="0" y="18" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="13px" fill="#94A3B8">Focus: Turning frontier LLM capabilities into deterministic, audited, production software.</text>
  </g>

  <!-- Metric Sidebar Card (Right Side) -->
  <g transform="translate(860, 38)">
    <rect width="280" height="244" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
    
    <!-- Stat 1 -->
    <g transform="translate(24, 26)">
      <text x="0" y="20" class="metric-val">6+ Systems</text>
      <text x="0" y="38" class="metric-sub">Open-Source AI Architectures</text>
    </g>

    <line x1="24" y1="80" x2="256" y2="80" stroke="#334155" stroke-width="1" />

    <!-- Stat 2 -->
    <g transform="translate(24, 100)">
      <text x="0" y="20" class="metric-val">100% Provenance</text>
      <text x="0" y="38" class="metric-sub">Zero-Hallucination Citations</text>
    </g>

    <line x1="24" y1="154" x2="256" y2="154" stroke="#334155" stroke-width="1" />

    <!-- Stat 3 -->
    <g transform="translate(24, 174)">
      <text x="0" y="20" class="metric-val" fill="#10B981">24h Delivery</text>
      <text x="0" y="38" class="metric-sub">Turnaround on Custom Gigs</text>
    </g>
  </g>
</svg>
